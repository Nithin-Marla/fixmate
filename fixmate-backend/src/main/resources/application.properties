spring.application.name=fixmate-backend
server.port=${PORT:8081}

# Eureka Client Configuration
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/fixmate?createDatabaseIfNotExist=true&useSSL=false&connectionTimeZone=LOCAL&forceConnectionTimeZoneToSession=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Mail Properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Nearby partner discovery
fixmate.nearby-search.initial-radius-km=5
fixmate.nearby-search.max-radius-km=50
fixmate.nearby-search.emergency-max-radius-km=25
# Locations older than this are treated as stale and excluded from nearby search.
fixmate.nearby-search.stale-location-minutes=15

# Demo / simulation mode: when true (local development), KYC submissions are
# auto-approved so freshly registered partners can go online immediately for
# demos. Set to false in production — approval then goes through the admin
# endpoint (PATCH /api/v1/admin/kyc/{profileId}).
fixmate.demo-mode=false

server.max-http-request-header-size=65536

# Admin Defaults
fixmate.admin.email=${ADMIN_EMAIL:admin@fixmate.com}
fixmate.admin.password=${ADMIN_PASSWORD}


version: '3.8'

services:
  # MySQL Database Service
  mysqldb:
    image: mysql:8.0
    container_name: fixmate-mysql
    restart: always
    environment:
      MYSQL_DATABASE: fixmate
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Spring Boot Application Service
  fixmate-app:
    build: .
    container_name: fixmate-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysqldb
      - DB_USER=root
      - DB_PASSWORD=root
    depends_on:
      - mysqldb

volumes:
  db_data:

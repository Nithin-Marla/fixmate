server:
  port: 8080

spring:
  application:
    name: fixmate-api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: fixmate-backend
          uri: lb://FIXMATE-BACKEND
          predicates:
            - Path=/api/v1/**,/v3/api-docs/**,/swagger-ui/**

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
